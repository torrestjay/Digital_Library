<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | Digital Library</title>
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/login.css" />
  <script src="https://kit.fontawesome.com/3b07bc6295.js" crossorigin="anonymous"></script>
  <style>
    .forgot-password-image {
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fa 100%);
    }
    .form-alert {
      background: #fef2f2;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 14px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .form-success {
      background: #f0fdf4;
      border: 1px solid var(--success);
      color: var(--success);
      padding: 14px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div id="toastBox"></div>
  <div class="login-container">
    <!-- Left Side Image -->
    <div class="login-image forgot-password-image">
      <img src="../Images/login.png" alt="Forgot Password Image" />
    </div>
    <!-- Right Side Form -->
    <div class="login-form">
      <h1>Reset Password</h1>
      <p><a href="../login.php" style="display: inline-flex; align-items: center; gap: 6px; color: var(--brand-strong); text-decoration: none; font-weight: 500;"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
      <div id="formContainer">
        <p style="color: var(--text-muted); margin-bottom: 24px;">Enter your email address and we'll send you a verification code to reset your password.</p>
        <form method="POST" action="reset-password.php" id="forgotForm">
          <input class="input-field" type="email" name="email" id="email" placeholder="Email Address" required />
          <button type="submit" class="btn btn-primary">Send Verification Code</button>
        </form>
      </div>
      <div id="messageContainer"></div>
    </div>
  </div>
  <script>
    let toastBox = document.getElementById('toastBox');
    function showToast(msg, isError = false) {
        let toast = document.createElement('div'); 
        toast.classList.add('toast');
        toast.innerHTML = msg;
        toastBox.appendChild(toast); 
        if (isError) {
            toast.classList.add('error');
        }
        const sound = document.getElementById('notifySound');
        if (sound) sound.play();
        setTimeout(() => {
            toast.remove();
        }, 4000);
    }
    
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const formContainer = document.getElementById('formContainer');
      const messageContainer = document.getElementById('messageContainer');
      
      try {
        const response = await fetch('send-reset-code.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: 'email=' + encodeURIComponent(email)
        });
        
        const result = await response.json();
        
        if (result.success) {
          showToast('<i class="fa-solid fa-circle-check"></i> Verification code sent successfully!');
          messageContainer.innerHTML = '<div class="form-success"><i class="fas fa-check-circle"></i> Check your email for the verification code!</div>';
          formContainer.style.display = 'none';
          setTimeout(() => {
            window.location.href = 'verify-reset-code.html?email=' + encodeURIComponent(email);
          }, 2000);
        } else {
          messageContainer.innerHTML = '<div class="form-alert"><i class="fas fa-exclamation-circle"></i> ' + result.message + '</div>';
          showToast('Error: ' + result.message, true);
        }
      } catch (error) {
        messageContainer.innerHTML = '<div class="form-alert"><i class="fas fa-exclamation-circle"></i> An error occurred. Please try again.</div>';
        showToast('Error: An error occurred. Please try again.', true);
      }
    });
    
    // Check for query parameters (for successful reset)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('status') === 'reset_success') {
        showToast('<i class="fa-solid fa-circle-check"></i> Password reset successful! Redirecting to login...');
        setTimeout(() => {
            window.location.href = '../login.php';
        }, 2000);
    }
  </script>
</body>
</html>
