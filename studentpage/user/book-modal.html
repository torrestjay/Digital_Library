<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Modal - The Great Gatsby</title>
  <link rel="stylesheet" href="../css/book-modal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="modal" id="bookModal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="bookModalTitle" aria-describedby="bookModalDesc">
  <div class="modal-content">
    <button type="button" class="close-btn" onclick="closeModal()" aria-label="Close dialog">×</button>
    <div class="book-image">
      <img id="modalCover" src="" alt="Book Cover">
    </div>
    <div class="book-info">
      <p style="letter-spacing: 0.12em; text-transform: uppercase; color: #1b678f; font-weight: 700; margin-bottom: 8px;">Featured Book</p>
      <h1 id="bookModalTitle">Book Title</h1>
      <p class="author" id="modalAuthor">Author Name</p>
      <p id="bookModalDesc" style="color: #5f7385; margin-bottom: 14px;">Browse the book details, then decide whether to read it or mark it for later.</p>
      <div class="stats">
        <div><span>👁</span> Reads<br><strong id="modalReads">--</strong></div>
        <div><span>⭐</span> Votes<br><strong id="modalVotes">--</strong></div>
        <div><span>📄</span> Parts<br><strong id="modalParts">--</strong></div>
      </div>
      <div class="buttons">
        <button type="button" class="read-btn">Read Now</button>
        <button type="button" class="fav-btn">Add to Favorites</button>
      </div>
      <div class="description">
        <h4>Publisher's Description:</h4>
        <p id="modalDescription">Book description here...</p>
      </div>
    </div>
  </div>
</div>
<script>
function openBookModal(bookId) {
  fetch('get_book.php?id=' + bookId)
    .then(response => response.json())
    .then(data => {
      document.getElementById("bookModalTitle").textContent = data.title;
      document.getElementById("modalAuthor").textContent = data.author;
      document.getElementById("modalCover").src = "uploads/" + data.cover_image;
      document.getElementById("modalDescription").textContent = data.description;
      // Optional: Replace with actual values if available
      document.getElementById("modalReads").textContent = data.reads || "1.2K";
      document.getElementById("modalVotes").textContent = data.votes || "100";
      document.getElementById("modalParts").textContent = data.parts || "10";
      document.getElementById("bookModal").style.display = "block";
    })
    .catch(error => console.error('Error fetching book:', error));
}
function closeModal() {
  document.getElementById("bookModal").style.display = "none";
}
</script>
</body>
</html>
